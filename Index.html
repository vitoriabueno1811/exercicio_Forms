<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 01</title>
</head>
<body>
         <h1 style="font-family: Arial, sans-serif; font-size: 24px;">Deixe um comentário</h1>
         <form>
           <label><b>Nome:</b></label>
           <br>
            <input type ="text" id="nome" placeholder required>
            <br>
            <label><b>Email:</b></label>
            <br>
            <input type="email" placeholder required/>
            <br>
            <label><b>Website:</b></label>
            <br>
            <input type="url" placeholder required>
            <br>
            <label><b>Comentário:</b></label>
            <br>
            <textarea rows="10" cols="50" placeholder required></textarea>
            <br>
            <p><b>Observação:Seu comentário será publicado após passar pelo moderador</b></p>
            <input type="submit" value="Enviar Comentário">
            </form>

</body>
</html>
