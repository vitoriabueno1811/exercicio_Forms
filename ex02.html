<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 02</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 12px;
        }
        h3 {
            font-size: 16px;
            text-transform: uppercase;
        }
        .campo {
            margin-bottom: 12px;
        }
        label {
            display: inline-block;
            width: 150px;
            font-weight: bold;
        }
        input[type="text"], input[type="password"], select, textarea {
            width: 200px;
            padding: 2px;
        }
        textarea {
            height: 95px;
            vertical-align: top;
        }
        .opcoes {
            display: inline-block;
        }
        .botoes {
            margin-top: 15px;
        }
        button {
            padding: 3px 8px;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h3>Manutenção de Usuários do Sistema Interno</h3>

    <form>
        <div class="campo">
            <label>Login</label>
            <input type="text" name="login">
        </div>

        <div class="campo">
            <label>Senha</label>
            <input type="password" name="senha">
        </div>

        <div class="campo">
            <label>Status</label> 
            <select name="status">
                <option value="inativo">Inativo</option>
                <option value="ativo">Ativo</option>
            </select>
        </div>

        <div class="campo">
            <label>Tipo</label>
            <div class="opcoes">
                <input type="radio" name="tipo" value="tecnico"><b>Técnico</b>
                <input type="radio" name="tipo" value="professor"><b>Professor</b>
                <input type="radio" name="tipo" value="aluno"><b>Aluno</b>
            </div>
        </div>

        <div class="campo">
            <label>Data Criação</label>
            <input type="text" name="data_criacao">
        </div>

        <div class="campo">
            <label>Perfil</label>
            <div class="opcoes">
                <input type="radio" name="perfil" value="convidado"> <b>Convidado</b>
                <input type="radio" name="perfil" value="administrador"><b>Administrador</b>
            </div>
        </div>

        <div class="campo">
            <label>Observações</label>
            <textarea name="observacoes"></textarea>
        </div>

        <div class="campo">
            <label>Módulos</label>
            <div class="opcoes">
                <input type="checkbox" name="modulos" value="compras"> <b>Compras</b>
                <input type="checkbox" name="modulos" value="biblioteca"> <b>Biblioteca</b>
                <input type="checkbox" name="modulos" value="academico"> <b>Acadêmico</b>
                <br><br>
                <input type="checkbox" name="modulos" value="documentacao"><b>Documentação</b>
                <input type="checkbox" name="modulos" value="rh"> <b>Recursos Humanos</b>
            </div>
        </div>

        <div class="botoes">
            <button type="submit">Cadastrar</button>
            <button type="button">Excluir</button>
        </div>
    </form>

</body>
</html>
